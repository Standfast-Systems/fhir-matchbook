# National and regional core and base guides for the International view. All three parties build
# to them, so they sit in the centre of the diagram, labelled with their country and sorted by it.
#
# Copied, not linked, from FHIR Initializr's hand-checked list (kb/realms.yaml in
# github.com/Standfast-Systems/fhir-initializr, curated 2026-10-21); the two apps stay independent.
# The registry's own "National Base" tagging points at the wrong package for several countries, so
# this list replaces the earlier registry rule. The EU entries are regional guides Initializr
# doesn't list.
#
# The official registry is Matchbook's only source of guides: an entry it doesn't list is skipped
# at build time (with a warning) and shows up by itself once the registry adds it. As of 2026-10-21
# that skips CL, DE, FR, IL, JP and UK.

- { country: AT, ig: hl7.at.fhir.core.r4 }
- { country: AU, ig: hl7.fhir.au.base }
- { country: AU, ig: hl7.fhir.au.core }

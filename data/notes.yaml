# Plain-language notes per guide, keyed by npm package id (must match data/ig-map.yaml).
#   name:  display-name override (registry titles are often clumsy)
#   blurb: one plain sentence for a newcomer; guides without one fall back to registry text
#   intl:  true marks a universal-realm guide meant strictly for outside the US (WHO guides are
#          caught by publisher). US view shows US + generic guides; International shows these.
#   start: true marks a good first guide; these sort to the top of the table. A number ranks it
#          (1 first) so the most important beginner guide in a region leads.

# All three: the shared foundation ----------------------------------------------------------------
hl7.fhir.us.core:
  name: US Core
  start: 1
  blurb: "The baseline US profiles for patient data (problems, meds, allergies, labs, notes). Almost every US guide builds on it."
hl7.fhir.uv.smart-app-launch:
  name: SMART App Launch
  start: 2
  blurb: "How an app signs in to a FHIR server and gets the patient's or user's permission, on its own or launched from inside the EHR."
hl7.fhir.uv.sdc:
  name: Structured Data Capture (SDC)
  start: 3
  blurb: "Forms and questionnaires: how they're defined, filled in, pre-populated from the record, and turned into structured data."
hl7.fhir.uv.extensions:
  name: FHIR Extensions Pack
  blurb: "The official catalog of extensions shared across guides. You rarely read it directly, but nearly every guide pulls it in."
hl7.fhirpath:
  name: FHIRPath
  blurb: "The small expression language FHIR uses for validation rules, search parameters and form logic."
hl7.xprod.uv.gender-harmony:
  name: Gender Harmony
  blurb: "How to record sex and gender consistently: gender identity, pronouns, name to use, and sex for clinical use."
hl7.terminology:
  name: HL7 Terminology (THO)
  blurb: "The official home of the HL7 code systems and value sets that guides point to."
hl7.fhir.uv.tools:
  name: HL7 Tools Extensions
  blurb: "Extensions used by the guide-publishing tools. Only matters if you write guides yourself."
hl7.xprod.uv.termfundamentals:
  name: Terminology Fundamentals
  blurb: "How code systems, value sets and concept maps work, explained once for all HL7 standards."
hl7.fhir.us.davinci-pct:
  name: Da Vinci Patient Cost Transparency
  blurb: "Good-faith cost estimates: the provider sends an estimate, and the payer returns what the patient is likely to owe."
hl7.fhir.uv.application-feature:
  name: Application Feature Framework
  blurb: "A way for servers and apps to say which optional features they support."
hl7.fhir.us.udap-security:
  name: UDAP Security (FAST)
  blurb: "Certificate-based app registration and sign-in, so apps don't have to register by hand with every server."
hl7.fhir.uv.fast-security:
  intl: true
  name: UDAP Security (international)
  blurb: "The international edition of certificate-based app registration and authorization."
hl7.fhir.us.identity-matching:
  name: Identity & Patient Matching
  blurb: "How to verify who someone is and match their record across organizations with enough confidence."
hl7.fhir.us.consent-management:
  name: Scalable Consent Management
  blurb: "Recording a patient's consent and enforcing it when their data is shared."
hl7.fhir.uv.security-label-ds4p:
  name: Data Segmentation for Privacy (DS4P)
  blurb: "Security labels that mark sensitive data (substance use, mental health, and so on) so systems can restrict it."
hl7.fhir.uv.aitransparency:
  name: AI Transparency on FHIR
  blurb: "How to record that AI produced or changed data, and which model and inputs were involved."
hl7.fhir.uv.subscriptions-backport:
  name: Subscriptions (R5 Backport)
  blurb: "Get notified when data changes instead of polling. Brings R5-style subscriptions to R4 servers."
hl7.fhir.uv.tx-ecosystem:
  name: Terminology Ecosystem
  blurb: "How terminology servers work together to answer code lookups and validation for the FHIR community."
ihe.iti.svcm:
  name: IHE Sharing Valuesets, Codes and Maps (SVCM)
  blurb: "IHE's profile for publishing and querying code systems, value sets and maps on a terminology server."
hl7.fhir.uv.termchangeset:
  name: Terminology Change Set Exchange
  blurb: "A format for sending a batch of terminology changes from one system to another."


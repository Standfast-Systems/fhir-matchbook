<header class="top">
  <a class="brand" routerLink="/">
    <img src="favicon.svg" alt="" width="28" height="28" />
    <span>FHIR <b>Matchbook</b></span>
  </a>

  <!-- Discover, Connect, Build. -->
  <nav class="sections" aria-label="Sections">
    <ul>
      <li>
        <a routerLink="/browsr" routerLinkActive="active" [ariaCurrentWhenActive]="true">Browsr</a>
      </li>
      <li>
        <a routerLink="/mappr" routerLinkActive="active" [ariaCurrentWhenActive]="true">Mappr</a>
      </li>
      <li>
        <a routerLink="/initializr" routerLinkActive="active" ariaCurrentWhenActive="page"
          >Initializr <small class="beta">BETA</small></a
        >
      </li>
    </ul>
  </nav>

  <!-- The FHIR release every section reads, and where to tell us what's wrong or missing. -->
  <app-release-switch class="release" />
  @if (feedback) {
    <a class="feedback" [href]="feedback" target="_blank" rel="noopener">Feedback ↗</a>
  }
</header>

<router-outlet />
